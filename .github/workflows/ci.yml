name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # svelte-kit `$env/static/public` types only exist for vars present at sync time.
      # CI has no `.env`; placeholders from `.env.example` are enough (not secrets).
      - run: cp .env.example .env
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
